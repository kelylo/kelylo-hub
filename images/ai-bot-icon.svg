<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f68712" />
      <stop offset="100%" stop-color="#03466e" />
    </linearGradient>
  </defs>
  <!-- Ask Me Anything message -->
  <text x="32" y="16" text-anchor="middle" font-size="10" fill="#03466e" font-family="Poppins,Arial,sans-serif">Ask Me Anything</text>
  <!-- ChatGPT-style hexagon flower -->
  <g transform="translate(32,40)">
    <g>
      <path d="M0-18 L15-9 L15 9 L0 18 L-15 9 L-15-9 Z" fill="url(#aiGradient)" stroke="#03466e" stroke-width="2"/>
      <path d="M0-18 L7.5-27 L22.5-18 L15-9" fill="none" stroke="#03466e" stroke-width="2"/>
      <path d="M15-9 L22.5 0 L15 9" fill="none" stroke="#03466e" stroke-width="2"/>
      <path d="M15 9 L7.5 18 L0 18" fill="none" stroke="#03466e" stroke-width="2"/>
      <path d="M0 18 L-7.5 27 L-15 9" fill="none" stroke="#03466e" stroke-width="2"/>
      <path d="M-15 9 L-22.5 0 L-15-9" fill="none" stroke="#03466e" stroke-width="2"/>
      <path d="M-15-9 L-7.5-18 L0-18" fill="none" stroke="#03466e" stroke-width="2"/>
    </g>
    <!-- Inner hexagon -->
    <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="#fff" stroke="#03466e" stroke-width="1.5"/>
  </g>
  <!-- Green live dot -->
  <circle cx="56" cy="72" r="4" fill="#2ecc40" stroke="#fff" stroke-width="1.5"/>
</svg>
