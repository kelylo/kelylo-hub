<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Player | KELYLO</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/logo-best.svg" type="image/svg+xml" />
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .viewer-header {
      background: linear-gradient(135deg, var(--brand-navy) 0%, var(--brand-orange) 100%);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .viewer-header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .viewer-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .viewer-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .viewer-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .viewer-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .video-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      overflow: hidden;
    }

    .video-container.with-summary {
      grid-template-columns: 1fr 380px;
    }

    .video-player {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-hover);
    }

    .video-player iframe {
      width: 100%;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .video-player video {
      width: 100%;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      background: #000;
    }

    .video-summary {
      background: white;
      border-left: 1px solid #E5E7EB;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .summary-header {
      padding: 20px;
      border-bottom: 1px solid #E5E7EB;
      background: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%);
    }

    .summary-header h2 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--brand-navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .summary-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      color: var(--text-dim);
    }

    .summary-loading i {
      font-size: 2.5rem;
      color: var(--brand-orange);
      margin-bottom: 16px;
      animation: spin 1s linear infinite;
    }

    .summary-text {
      line-height: 1.8;
      color: var(--text);
    }

    .summary-text h3 {
      color: var(--brand-navy);
      font-size: 1rem;
      margin: 16px 0 8px 0;
    }

    .summary-text ul {
      margin: 8px 0;
      padding-left: 20px;
    }

    .summary-text li {
      margin: 4px 0;
    }

    .summary-error {
      background: #FEF2F2;
      color: #DC2626;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #FCA5A5;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 968px) {
      .video-container.with-summary {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }

      .video-summary {
        border-left: none;
        border-top: 1px solid #E5E7EB;
        max-height: 40vh;
      }
    }
  </style>
</head>
<body>
  <div class="viewer-header">
    <h1>
      <i class="fa-brands fa-youtube"></i>
      <span id="videoTitle">Video Player</span>
    </h1>
    <div class="viewer-actions">
      <button class="viewer-btn" id="summarizeBtn">
        <i class="fa-solid fa-magic"></i>
        AI Summary
      </button>
      <button class="viewer-btn" onclick="window.close()">
        <i class="fa-solid fa-times"></i>
        Close
      </button>
    </div>
  </div>

  <div class="video-container" id="videoContainer">
    <div class="video-player">
      <iframe 
        id="videoPlayer"
        src="" 
        title="Video Player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" 
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen
        frameborder="0">
      </iframe>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="resources-manager.js"></script>
  <script src="ai-manager.js"></script>
  <script>
    // Get video URL from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('url');
    const videoTitle = urlParams.get('title');
    let embedUrl = '';
    let originalUrl = '';

    // Load video
    if (videoUrl) {
      originalUrl = decodeURIComponent(videoUrl);
      
      // Parse the URL first (handles iframe extraction)
      const parsed = ResourcesManager.parseVideoUrl(originalUrl);
      
      if (parsed && parsed.embedUrl) {
        document.getElementById('videoPlayer').src = parsed.embedUrl;
        document.getElementById('videoTitle').textContent = decodeURIComponent(videoTitle || 'Video Player');
        document.title = `${decodeURIComponent(videoTitle || 'Video')} | KELYLO`;
      } else {
        alert('Invalid video URL. Please use a YouTube, Vimeo, or direct video link.');
        window.close();
      }
    } else {
      alert('No video URL provided');
      window.close();
    }

    // Summarize button
    document.getElementById('summarizeBtn').addEventListener('click', async function() {
      const btn = this;
      const container = document.getElementById('videoContainer');
      
      // Create summary panel if it doesn't exist
      if (!document.querySelector('.video-summary')) {
        container.classList.add('with-summary');
        container.insertAdjacentHTML('beforeend', `
          <div class="video-summary">
            <div class="summary-header">
              <h2>
                <i class="fa-solid fa-robot"></i>
                AI Summary
              </h2>
            </div>
            <div class="summary-content" id="summaryContent">
              <div class="summary-loading">
                <i class="fa-solid fa-spinner"></i>
                <p>Generating AI summary...</p>
              </div>
            </div>
          </div>
        `);

        // Disable button and generate summary
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';

        try {
          const summary = await ResourcesManager.summarizeYouTubeVideo(originalUrl);
          const summaryContent = document.getElementById('summaryContent');
          
          if (summary) {
            // Format the summary
            const formattedSummary = summary.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
            summaryContent.innerHTML = `<div class="summary-text"><p>${formattedSummary}</p></div>`;
          } else {
            summaryContent.innerHTML = `
              <div class="summary-error">
                <i class="fa-solid fa-exclamation-circle"></i>
                Unable to generate summary. Please try again.
              </div>
            `;
          }
        } catch (error) {
          console.error('Error generating summary:', error);
          document.getElementById('summaryContent').innerHTML = `
            <div class="summary-error">
              <i class="fa-solid fa-exclamation-circle"></i>
              Error: ${error.message}
            </div>
          `;
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Summary Ready';
        }
      } else {
        // Toggle summary panel
        const summaryPanel = document.querySelector('.video-summary');
        if (summaryPanel.style.display === 'none') {
          summaryPanel.style.display = 'flex';
          container.classList.add('with-summary');
        } else {
          summaryPanel.style.display = 'none';
          container.classList.remove('with-summary');
        }
      }
    });
  </script>
</body>
</html>
